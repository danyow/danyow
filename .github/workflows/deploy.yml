name: Check root site and publish legacy redirects

on:
  push:
    branches: [main]
    paths-ignore: ['lua/**', 'unity/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test archive, content migration and redirects
        run: npm test
      - name: Check corrections against previous originals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            node scripts/build-ai-engine-archive.cjs --check-revisions "$BASE_SHA"
          fi
      - name: Type check
        env:
          SITE_BASE_URL: /
        run: npm run check
      - name: Validate canonical root build without publishing a duplicate site
        env:
          SITE_BASE_URL: /
          SITE_URL: https://danyow.cn
        run: npm run build
      - name: Generate redirect-only project Pages artifact
        run: node scripts/build-legacy-redirects.mjs dist .generated/legacy-redirects
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-redirects
          path: .generated/legacy-redirects
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: legacy-redirects
          path: .generated/legacy-redirects
      - name: Replace old project site with redirects only
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .generated/legacy-redirects
          publish_branch: gh-pages
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Verify live old-to-root navigation and fallback
        run: node scripts/verify-legacy-redirects.mjs
